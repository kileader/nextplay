spring.application.name=nextplay-backend

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ── IGDB / Twitch OAuth ───────────────────────────────────────────────────────
igdb.client-id=${IGDB_CLIENT_ID}
igdb.client-secret=${IGDB_CLIENT_SECRET}
igdb.auth-url=https://id.twitch.tv/oauth2/token
igdb.base-url=https://api.igdb.com/v4

# ── CheapShark ────────────────────────────────────────────────────────────────
cheapshark.base-url=https://www.cheapshark.com/api/1.0

# ── HowLongToBeat ─────────────────────────────────────────────────────────────
hltb.base-url=https://howlongtobeat.com
hltb.request-delay-ms=2000

# ── Cache refresh job ─────────────────────────────────────────────────────────
cache.refresh.cron=0 0 3 * * *
cache.min-rating-count=10

# ── Mail (failure notifications) ──────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.alert.to=${MAIL_ALERT_TO:}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
